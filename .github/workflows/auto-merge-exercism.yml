name: Auto-merge Exercism Sync Branches

on:
  push:
    branches:
      - 'exercism-sync/**'

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward / Apply Exercism commit to main
        run: |
          git checkout main
          git pull origin main

          SOURCE_BRANCH="${{ github.ref_name }}"
          
          # Extract the original commit message from the incoming branch
          COMMIT_MSG=$(git log -1 --pretty=%B "$SOURCE_BRANCH")
          
          # Merge using the exact original commit message
          echo "Merging $SOURCE_BRANCH with message: $COMMIT_MSG"
          git merge --no-ff -m "$COMMIT_MSG" "$SOURCE_BRANCH"

          # Push to main
          git push origin main

      - name: Delete source branch
        run: |
          git push origin --delete "${{ github.ref_name }}"
