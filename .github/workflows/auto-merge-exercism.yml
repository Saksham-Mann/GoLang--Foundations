name: Auto-merge Exercism Sync Branches

on:
  push:
    branches:
      - 'exercism-sync/**'
      - 'main'

jobs:
  sync-and-update:
    # Skip running if the commit was generated by GitHub Actions itself to avoid infinite loops
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Exercism branch (if triggered by sync branch)
        if: startsWith(github.ref_name, 'exercism-sync/')
        run: |
          git fetch origin ${{ github.ref_name }}:${{ github.ref_name }}
          git checkout main
          git pull origin main

          SOURCE_BRANCH="${{ github.ref_name }}"
          COMMIT_MSG=$(git log -1 --pretty=\%B "$SOURCE_BRANCH")

          echo "Merging $SOURCE_BRANCH with message:$COMMIT_MSG"
          git merge --no-ff -m "$COMMIT_MSG" "$SOURCE_BRANCH"

      - name: Update README.md Directory Tree
        run: |
          git checkout main || true

          python3 - << 'EOF'
          import os
          import re

          base_path = "solutions/go"
          if not os.path.exists(base_path):
              exit(0)

          exercises = sorted([
              d for d in os.listdir(base_path)
              if os.path.isdir(os.path.join(base_path, d)) and not d.startswith(".")
          ])

          tree_lines = [
              ".",
              "├── .github/workflows/        # Automated merge workflows for Exercism sync",
              "└── solutions/",
              "    └── go/"
          ]

          total = len(exercises)
          for idx, item in enumerate(exercises):
              branch = "└── " if idx == total - 1 else "├── "
              tree_lines.append(f"        {branch}{item}/")

          tree_text = "\n".join(tree_lines)
          replacement = f"<!-- TREE_START -->\n```text\n{tree_text}\n```\n<!-- TREE_END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r"<!-- TREE_START -->.*?<!-- TREE_END -->"
          if re.search(pattern, content, flags=re.DOTALL):
              new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
          EOF

          # Stage README and check if there are changes to push
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update repository structure in README [skip ci]"
          fi

          # Push changes to main safely
          git push origin main

      - name: Delete source branch
        if: startsWith(github.ref_name, 'exercism-sync/')
        run: |
          git push origin --delete "${{ github.ref_name }}" || true
